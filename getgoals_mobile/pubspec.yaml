name: getgoals_mobile
description: "GetGoals TOEIC Practice - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation & State
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1

  # Network & Storage
  dio: ^5.9.2
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5

  # Media
  just_audio: ^0.10.5
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0

  # UI
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  json_annotation: ^4.11.0
  flex_color_scheme: ^8.4.0
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  lucide_icons_flutter: ^3.1.14
  flutter_svg: ^2.3.0
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^2.0.1
  percent_indicator: ^4.2.5
  gap: ^3.0.1
  lottie: ^3.3.3
  webview_flutter: ^4.13.1
  google_sign_in: ^7.2.0
  rive: ^0.14.6
  google_fonts: ^8.1.0
  iconsax_flutter: ^1.0.1
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.13.2

flutter:
  uses-material-design: true

  assets:
    - assets/rive/login_character.riv
